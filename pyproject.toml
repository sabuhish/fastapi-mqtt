[project]
name = "fastapi-mqtt"
version = "2.2.0"
description = "fastapi-mqtt is extension for MQTT protocol"
authors = [{ name = "Sabuhi Shukurov", email = "sabuhi.shukurov@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "gmqtt>=0.8.0",
    "pydantic>=2.14.1",
]

[project.urls]
homepage = "https://github.com/sabuhish/fastapi-mqtt"
repository = "https://github.com/sabuhish/fastapi-mqtt"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "async-asgi-testclient>=1.4.11",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
fix = true
line-length = 100

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "BLE", "C", "E", "F", "I", "N", "PIE", "PTH", "RUF", "SIM", "TCH", "W"]
ignore = ["TC006"]  # quoted types in typing.cast()

[tool.ruff.lint.isort]
known-first-party = ["fastapi_mqtt"]
order-by-type = false

[tool.mypy]
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[tool.pytest.ini_options]
minversion = 7.0
asyncio_mode = "auto"
addopts = "--cov fastapi_mqtt --cov-report term --cov-report html"
testpaths = "tests"
log_cli = true

[tool.coverage.report]
fail_under = 75
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "except ImportError:",
]
